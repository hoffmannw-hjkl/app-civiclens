apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: civiclens-backend-config
  namespace: civiclens
spec:
  timeoutSec: 120
  iap:
    enabled: true
    oauthclientCredentials:
      secretName: iap-secret
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 8000
  logging:
    enable: true
    sampleRate: 1.0
