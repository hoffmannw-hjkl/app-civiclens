name: CI & Build Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check requirements syntax
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          flake8 --version

      - name: Validate Kubernetes Manifests
        run: |
          for f in deploy/k8s/*.yaml; do
            echo "Checking $f..."
          done
